[pytest]
# Pytest 全局配置

# 测试发现规则
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 命令行选项
addopts = 
    -v
    --strict-markers
    --tb=short
    --alluredir=tests/reports/allure-results
    --clean-alluredir

# Markers 定义（与 conftest.py 中的注册保持一致）
markers =
    smoke: 冒烟测试用例
    regression: 回归测试用例
    functional: 功能测试用例
    api: API 测试用例
    ui: UI 测试用例

# 日志配置
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# 最小版本要求
minversion = 6.0

# 其他选项
norecursedirs = .git .pytest_cache __pycache__ *.egg venv env node_modules
